name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: |
          flutter create --platforms=android --project-name currency_app --org com.forexmarket .
          rm -rf test analysis_options.yaml

      - name: Add INTERNET permission and app name
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || \
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#android:label="[^"]*"#android:label="Forex-Market 2"#' $M

      - run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - run: flutter analyze --no-fatal-infos

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: currency-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk